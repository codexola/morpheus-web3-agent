[project]
name = "morpheus-web3-agent"
version = "1.0.0"
description = "Web3Dev AI — Morpheus Protocol autonomous Web3 development agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "httpx>=0.27.0",
  "openai>=1.54.0",
  "python-multipart>=0.0.12",
  "orjson>=3.10.0",
  "asyncpg>=0.30.0",
  "sentry-sdk>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0", "python-dotenv>=1.0.0"]

[tool.vercel]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
